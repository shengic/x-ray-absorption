# config.yaml | version 1.3.0 by Albert Sheng | R-EDGE-FWHM + R-NORM-COEFS z 門檻由分佈校準
# NiXZ-121 examine rules & thresholds.
# All numeric values are starting seeds, NOT literature standards.
# Program must not hard-code thresholds elsewhere; edit this file (or use the
# GUI Rules panel) to tune.

grid: {n: 11}

edge:                       # Ni K-edge; see doc/NiXZ-121_project.md §3, §4.2
  element: Ni
  edge: K
  e0_nominal_eV: 8333.0
  e0_alt_eV: 8331.90
  e0_nominal_tol_eV: 1.5
  mono_offset_window_eV: [-5.0, 25.0]
  ref_e0_search_eV: [8320.0, 8370.0]
  ref_e0_spread_tol_eV: 0.3

examine:
  combine_mode: worst       # worst | weighted (weighted not implemented yet)
  shape_grid_eV: [-30.0, 150.0, 0.3]   # relative to median E0: start, end, step

rules:
  # GATE-EDGE calibrated from 121-cell distribution (2026-09-28, D8 closed):
  # median=0.345, MAD*1.4826=0.167, range [0.043, 0.929]. Bimodal — 11 cells
  # cluster at [0.04, 0.07] (off-sample edge pixels), gap at [0.10, 0.13],
  # 110 real cells at [0.13, 0.93]. Lower 0.10 sits in the natural gap.
  # Upper 1.5 leaves headroom for thicker future samples (current max 0.93).
  # Gaur 2026 [0.5, 2.0] is for bulk single-spectrum QC, not for mapping
  # where off-sample pixels are expected. See doc/NiXZ-121_project.md §10 D8.
  GATE-EDGE:  {enabled: true,  min: 0.10, max: 1.5}
  CAL-EREF:   {enabled: true}
  R-SNR:      {enabled: true,  warn_z: 3, fail_z: 5}
  R-NOISE-HF: {enabled: true,  warn_z: 3, fail_z: 5}
  R-PRE-FLAT: {enabled: true,  warn_z: 3, fail_z: 5}
  R-GLITCH:   {enabled: true,  warn_z: 3, fail_z: 5, max_count: 5}
  # R-EDGE-FWHM + R-NORM-COEFS z thresholds calibrated on 110 gate-pass cells
  # (2026-09-28). Distributions are near-Gaussian (P50/max|z| ~ 0.67, matches
  # N(0,1) MAD ratio 0.6745), so z ~ sigma. Old fail_z=5 was 5-sigma -> never
  # triggered on real data. Leys 2013 suggests warn=2.5 (default), 3=very
  # conservative; 4-sigma is the "clearly outlier" line for a near-Gaussian.
  # On current 110-cell grid: R-EDGE-FWHM ~4 WARN 0 FAIL; R-NORM-COEFS ~3
  # WARN 0 FAIL. Any future >=4-sigma outlier flags immediately.
  # See doc/NiXZ-121_project.md §10 D10.
  R-EDGE-FWHM: {enabled: true, warn_z: 2.5, fail_z: 4}   # Gaur 2026 abs window 0.5-2.0 eV -> here grid-relative
  R-NORM-COEFS: {enabled: true, warn_z: 2.5, fail_z: 4}  # §5.2 A Q3: pre_slope + norm_c1 + norm_c2 max-|z|
  C-SHAPE:    {enabled: true,  warn_z: 3, fail_z: 5}
  C-E0-NBR:   {enabled: true,  warn_z: 3, fail_z: 5}
  C-CUMDIFF:  {enabled: false, warn_z: 3, fail_z: 5}   # Lippold 2005 crit 7 vs 8-neighbour mean; opt-in
  T-DRIFT:        {enabled: false}
  T-UPDOWN:       {enabled: false}
  T-OUTLIER-SCAN: {enabled: false}
  T-SATURATION:   {enabled: false}

db:
  enabled: false            # MySQL disabled until schema finalized
  host: localhost
  port: 3306
  schema: xanes
  user: xanes
  password_env: XANES_DB_PASSWORD   # env var only; do not put password in file
